# Vorübergehend: prüft, warum die SEC dem täglichen Workflow mit 403 antwortet (wird vor dem Zusammenführen entfernt).
name: SEC-Diagnose

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/sec-diagnose.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SEC mit verschiedenen Kennungen abfragen
        run: |
          probe() {
            ua="$1"; url="$2"
            code=$(curl -s -o body.txt -w "%{http_code}" --compressed -H "User-Agent: $ua" "$url")
            echo "[$code] UA='$ua' URL=$url"
            if [ "$code" != "200" ]; then
              sed -e 's/<[^>]*>/ /g' body.txt | tr -s ' \n' ' ' | cut -c1-500; echo
            else
              head -c 120 body.txt; echo
            fi
            sleep 1
          }
          T=https://www.sec.gov/files/company_tickers.json
          F=https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json
          probe "Aktientool (GitHub-Workflow ${{ github.repository }}) aktientool@example.com" "$T"
          probe "Aktientool lokal aktientool@example.com" "$T"
          probe "Aktientool ${{ github.repository_owner }}@users.noreply.github.com" "$T"
          probe "Aktientool ${{ github.repository_owner }}@users.noreply.github.com" "$F"
          probe "Aktientool lokal aktientool@example.com" "$F"
          curl -s https://api.ipify.org; echo " <- Adresse des Runners"
